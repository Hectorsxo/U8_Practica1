
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h1>Productos</h1>
<form action="/productos" method="post">
<input type="text" name="nombre"/>
    <input type="text" name="descripcion"/>
<input type="number" step="0.01" name="precio"/>
<select name="categoria.id">
<option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
</select>
<button>Guardar</button>
</form>
<ul>
    <li th:each="p : ${productos}"
        th:text="${p.nombre} + ' - ' + ${p.categoria.nombre} + ' - ' + ${p.precio} + '€'">
    </li>
</ul>
<table>
    <thead>
    <th>Nombre</th>
    <th>Precio</th>
    <th>Categoria</th>
    <Th>Acciones</Th>
    </thead>
    <tbody>
    <tr th:each="p : ${productos}">
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.precio}"></td>
        <td th:text="${p.categoria.nombre}"></td>
        <td><a th:href="@{/productos/eliminar/{id}(id=${p.id})}">Eliminar</a></td>
        <td><a th:href="@{/productos_actualizar/rellenar/{id}(id=${p.id})}">Modificar</a></td>
    </tr>
    </tbody>
</table>
<a href="/categorias">Categorías</a>
</body>
</html>
