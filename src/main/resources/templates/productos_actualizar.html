<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h1>Modificar producto</h1>

<form th:action="@{/productos_actualizar}" method="post">
    <input hidden="true" type="text" name="id" th:value="${producto.id}"/>

    <input type="text" name="nombre" th:value="${producto.nombre}" placeholder="Nombre"/>

    <input type="text" name="descripcion" th:value="${producto.descripcion}" placeholder="Descripción"/>

    <input type="number" step="0.01" name="precio" th:value="${producto.precio}" placeholder="Precio"/>

    <select name="categoria.id">
        <option th:each="c : ${categorias}"
                th:value="${c.id}"
                th:text="${c.nombre}"
                th:selected="${c.id == producto.categoria.id}">
        </option>
    </select>

    <button type="submit">Guardar</button>
</form>

</body>
</html>
