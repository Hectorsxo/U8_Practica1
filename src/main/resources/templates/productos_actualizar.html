
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<h1>Modificar producto</h1>
<form th:action="{@/productos_actualizar}" method="post">
    <input hidden="true" type="text" name="id" th:value="${producto.id}"/>
    <input type="text" name="nombre" th:value="${producto.nombre}"/>
    <input type="text" name="descripcion" th:value="${producto.descripcion}"/>
    <input type="number" step="0.01" name="precio" th:value="${producto.precio}"/>
    <select name="categoria.id">
        <option th:each="c : ${categorias}"
                th:value="${c.id}"
                th:text="${c.nombre}"
                th:selected="{c.id == producto.categoria.id}">
        </option>
    </select>
    <button>Guardar</button>
</form>

</body>
</html>
